<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mini Web Royale</title>
  <style>
    body { background: #222; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; }
    canvas { background: #4CAF50; border: 4px solid #333; border-radius: 8px; max-width: 100%; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
    .ui { margin-top: 15px; display: flex; justify-content: center; gap: 20px; align-items: center; }
    .btn { background: #2196F3; color: white; border: none; padding: 15px 25px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }
    .btn:active { background: #1976D2; transform: scale(0.95); }
    .elixir-bar { width: 200px; height: 20px; background: #555; border-radius: 10px; overflow: hidden; border: 2px solid #fff; }
    .elixir-fill { width: 0%; height: 100%; background: #E91E63; transition: width 0.1s; }
  </style>
</head>
<body>

  <h2>👑 Mini Royale</h2>
  <canvas id="gameCanvas" width="400" height="600"></canvas>
  
  <div class="ui">
    <div class="elixir-bar">
      <div class="elixir-fill" id="elixirFill"></div>
    </div>
    <button class="btn" onclick="spawnPlayerUnit()">⚔️ Caballero (3)</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Variables del juego
    let elixir = 5;
    let enemyElixir = 5;
    const maxElixir = 10;
    const units = [];
    
    // Bases (Torres)
    const playerBase = { x: 200, y: 550, hp: 1000, maxHp: 1000, color: '#2196F3' };
    const enemyBase = { x: 200, y: 50, hp: 1000, maxHp: 1000, color: '#F44336' };

    class Unit {
      constructor(isPlayer) {
        this.isPlayer = isPlayer;
        this.x = isPlayer ? 180 + Math.random() * 40 : 180 + Math.random() * 40;
        this.y = isPlayer ? 500 : 100;
        this.size = 20;
        this.hp = 150;
        this.maxHp = 150;
        this.damage = 20;
        this.speed = isPlayer ? -1.5 : 1.5;
        this.color = isPlayer ? '#64B5F6' : '#E57373';
        this.attackCooldown = 0;
      }

      update() {
        // Encontrar enemigo más cercano (unidad o torre)
        let target = null;
        let minDist = 50; // Rango de ataque

        // Buscar unidades enemigas
        for (let u of units) {
          if (u.isPlayer !== this.isPlayer && u.hp > 0) {
            let dist = Math.abs(this.y - u.y);
            if (dist < minDist && Math.abs(this.x - u.x) < 30) {
              target = u;
            }
          }
        }

        // Si no hay unidades en rango, ver si la torre está en rango
        let enemyTower = this.isPlayer ? enemyBase : playerBase;
        if (!target && Math.abs(this.y - enemyTower.y) < 60) {
          target = enemyTower;
        }

        if (target) {
          // Atacar
          if (this.attackCooldown <= 0) {
            target.hp -= this.damage;
            this.attackCooldown = 60; // 1 ataque por segundo aprox (a 60fps)
          }
        } else {
          // Moverse
          this.y += this.speed;
        }

        this.attackCooldown--;
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
        
        // Barra de vida de la unidad
        ctx.fillStyle = 'red';
        ctx.fillRect(this.x - 10, this.y - 15, 20, 4);
        ctx.fillStyle = '#00FF00';
        ctx.fillRect(this.x - 10, this.y - 15, 20 * (this.hp / this.maxHp), 4);
      }
    }

    function spawnPlayerUnit() {
      if (elixir >= 3) {
        elixir -= 3;
        units.push(new Unit(true));
      }
    }

    function enemyAI() {
      if (enemyElixir >= 4) { // El enemigo espera a tener 4 de elixir
        enemyElixir -= 3;
        units.push(new Unit(false));
      }
    }

    function drawBase(base) {
      ctx.fillStyle = base.color;
      ctx.fillRect(base.x - 40, base.y - 40, 80, 80);
      
      // Vida de la base
      ctx.fillStyle = 'black';
      ctx.fillRect(base.x - 40, base.y - 60, 80, 10);
      ctx.fillStyle = '#00FF00';
      ctx.fillRect(base.x - 40, base.y - 60, 80 * (base.hp / base.maxHp), 10);
    }

    function gameLoop() {
      // Limpiar pantalla
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Generar elixir
      if (elixir < maxElixir) elixir += 0.02;
      if (enemyElixir < maxElixir) enemyElixir += 0.02;
      document.getElementById('elixirFill').style.width = (elixir * 10) + '%';

      enemyAI();

      // Dibujar torres
      drawBase(playerBase);
      drawBase(enemyBase);

      // Actualizar y dibujar unidades
      for (let i = units.length - 1; i >= 0; i--) {
        let u = units[i];
        if (u.hp <= 0) {
          units.splice(i, 1); // Eliminar muertos
          continue;
        }
        u.update();
        u.draw();
      }

      // Comprobar fin del juego
      if (playerBase.hp <= 0) {
        alert("¡Has perdido! La torre roja te destruyó.");
        location.reload();
        return;
      }
      if (enemyBase.hp <= 0) {
        alert("¡VICTORIA! Destruiste la torre enemiga.");
        location.reload();
        return;
      }

      requestAnimationFrame(gameLoop);
    }

    // Iniciar juego
    gameLoop();
  </script>
</body>
</html>
    renderGrid();
  </script>
</body>
</html>
