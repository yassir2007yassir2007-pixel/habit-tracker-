<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Habit Tracker Pro</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card-bg: rgba(28, 28, 30, 0.85);
      --text: #FFFFFF;
      --text-sec: #8E8E93;
      --accent: #0A84FF;
      --success: #30D158;
      --border: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; padding-top: env(safe-area-inset-top); }
    header { padding: 20px 16px 10px; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 28px; font-weight: 700; }
    .btn-add { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 15px; }
    .habits-container { padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }
    .habit-card { background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
    .habit-info { display: flex; align-items: center; gap: 12px; }
    .habit-emoji { font-size: 24px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 12px; }
    .habit-title { font-size: 17px; font-weight: 600; }
    .habit-streak { font-size: 13px; color: var(--text-sec); margin-top: 2px; }
    .check-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--accent); background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .check-btn.completed { background: var(--success); border-color: var(--success); }
    .check-btn.completed::after { content: '✓'; color: white; font-weight: bold; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(28, 28, 30, 0.95); backdrop-filter: blur(20px); border-top: 0.5px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); }
    .nav-item { color: var(--text-sec); text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .nav-item.active { color: var(--accent); }
    
    /* Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; padding: 20px; z-index: 100; }
    .modal-content { background: #1c1c1e; width: 100%; max-width: 350px; border-radius: 20px; padding: 20px; border: 1px solid var(--border); }
    .modal h2 { margin-bottom: 16px; font-size: 20px; }
    input { width: 100%; background: #2c2c2e; border: none; padding: 12px; border-radius: 10px; color: white; margin-bottom: 12px; font-size: 16px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
    .btn-secondary { background: #2c2c2e; color: white; border: none; padding: 10px 16px; border-radius: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>Mis Hábitos</h1>
    <button class="btn-add" onclick="openModal()">+ Nuevo</button>
  </header>

  <div class="habits-container" id="habitsList"></div>

  <!-- Modal Nuevo Hábito -->
  <div class="modal" id="habitModal">
    <div class="modal-content">
      <h2>Añadir Hábito</h2>
      <input type="text" id="habitEmoji" placeholder="Emoji (ej. 🏃‍♂️, 💧, 📖)" value="✨">
      <input type="text" id="habitName" placeholder="Nombre del hábito">
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn-add" onclick="saveHabit()">Guardar</button>
      </div>
    </div>
  </div>

  <nav>
    <a href="#" class="nav-item active"><span>📅</span>Hoy</a>
    <a href="#" class="nav-item" onclick="alert('Estadísticas próximamente en tus actualizaciones')"><span>📊</span>Progreso</a>
  </nav>

  <script>
    let habits = JSON.parse(localStorage.getItem('my_habits')) || [
      { id: 1, name: 'Beber 2L de Agua', emoji: '💧', completed: false, streak: 3 },
      { id: 2, name: 'Hacer Ejercicio', emoji: '🏋️‍♂️', completed: false, streak: 1 }
    ];

    function renderHabits() {
      const container = document.getElementById('habitsList');
      container.innerHTML = '';
      
      habits.forEach(habit => {
        const card = document.createElement('div');
        card.className = 'habit-card';
        card.innerHTML = `
          <div class="habit-info">
            <span class="habit-emoji">${habit.emoji}</span>
            <div>
              <div class="habit-title">${habit.name}</div>
              <div class="habit-streak">🔥 Racha de ${habit.streak} días</div>
            </div>
          </div>
          <button class="check-btn ${habit.completed ? 'completed' : ''}" onclick="toggleHabit(${habit.id})"></button>
        `;
        container.appendChild(card);
      });
      
      localStorage.setItem('my_habits', JSON.stringify(habits));
    }

    function toggleHabit(id) {
      habits = habits.map(h => {
        if (h.id === id) {
          const nextState = !h.completed;
          return { ...h, completed: nextState, streak: nextState ? h.streak + 1 : h.streak - 1 };
        }
        return h;
      });
      renderHabits();
    }

    function openModal() { document.getElementById('habitModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('habitModal').style.display = 'none'; }

    function saveHabit() {
      const name = document.getElementById('habitName').value;
      const emoji = document.getElementById('habitEmoji').value || '✨';
      if (!name) return;

      habits.push({ id: Date.now(), name, emoji, completed: false, streak: 0 });
      document.getElementById('habitName').value = '';
      closeModal();
      renderHabits();
    }

    renderHabits();
  </script>
</body>
</html>
