<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Today Habits</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #000000;
      --card-bg: #121214;
      --text: #ffffff;
      --text-sec: #8e8e93;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Display", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: 40px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .pill-btn {
      background: #1c1c1e;
      color: #ffffff;
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .add-btn {
      background: #1c1c1e;
      color: #ffffff;
      border: 1px solid var(--border);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    h1 {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }

    /* Grid Layout */
    .habits-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Habit Card */
    .habit-card {
      border-radius: 22px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 160px;
      position: relative;
      transition: transform 0.15s ease;
    }

    .habit-card:active {
      transform: scale(0.97);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .streak-count {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .streak-unit {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.7;
      margin-top: 4px;
    }

    .check-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
    }

    .habit-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    /* Weekday Dots */
    .week-dots {
      display: flex;
      gap: 3px;
      align-items: center;
    }

    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      font-size: 9px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.25);
      color: rgba(255, 255, 255, 0.5);
    }

    .dot.active {
      background: rgba(255, 255, 255, 0.9);
      color: #000;
    }

    .week-ratio {
      font-size: 11px;
      font-weight: 600;
      margin-left: auto;
      opacity: 0.6;
    }

    /* Temas de Color (Estilo Capturas) */
    .theme-blue { background: #12213a; color: #64b5f6; }
    .theme-blue .check-circle { background: #1e88e5; }
    
    .theme-pink { background: #2d1822; color: #f48fb1; }
    .theme-pink .check-circle { background: #ec407a; }

    .theme-green { background: #11281d; color: #81c784; }
    .theme-green .check-circle { background: #43a047; }

    .theme-orange { background: #2d1e12; color: #ffb74d; }
    .theme-orange .check-circle { background: #fb8c00; }

    .theme-red { background: #2c1616; color: #e57373; }
    .theme-red .check-circle { background: #e53935; }

    .theme-purple { background: #201830; color: #b39ddb; }
    .theme-purple .check-circle { background: #8e24aa; }

    .theme-cyan { background: #10262b; color: #4dd0e1; }
    .theme-cyan .check-circle { background: #00acc1; }

    .theme-yellow { background: #2a2713; color: #fff176; }
    .theme-yellow .check-circle { background: #fdd835; }

    /* Textos blancos dentro de tarjeta */
    .habit-card .habit-title, .habit-card .streak-count { color: #ffffff; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-content {
      background: #1c1c1e;
      width: 100%;
      max-width: 340px;
      border-radius: 24px;
      padding: 20px;
      border: 1px solid var(--border);
    }

    .modal h2 { margin-bottom: 16px; font-size: 20px; }

    input, select {
      width: 100%;
      background: #2c2c2e;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 12px;
      color: white;
      margin-bottom: 12px;
      font-size: 15px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .btn-cancel { background: #2c2c2e; color: white; border: none; padding: 10px 16px; border-radius: 12px; }
    .btn-save { background: #0a84ff; color: white; border: none; padding: 10px 16px; border-radius: 12px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="pill-btn">⇄ Sync</button>
    <button class="add-btn" onclick="openModal()">+</button>
  </div>

  <h1>Today</h1>

  <div class="habits-grid" id="habitsGrid"></div>

  <!-- Modal Nuevo Hábito -->
  <div class="modal" id="habitModal">
    <div class="modal-content">
      <h2>Nuevo Hábito</h2>
      <input type="text" id="habitName" placeholder="Nombre (ej. Meditate, Read)">
      <select id="habitIcon">
        <option value="💧">💧 Gota (Agua/Días)</option>
        <option value="🔥">🔥 Fuego (Racha/Semanas)</option>
      </select>
      <select id="habitTheme">
        <option value="theme-blue">Azul</option>
        <option value="theme-pink">Rosa</option>
        <option value="theme-green">Verde</option>
        <option value="theme-orange">Naranja</option>
        <option value="theme-red">Rojo</option>
        <option value="theme-purple">Morado</option>
        <option value="theme-cyan">Cian</option>
        <option value="theme-yellow">Amarillo</option>
      </select>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn-save" onclick="saveHabit()">Crear</button>
      </div>
    </div>
  </div>

  <script>
    var habits = JSON.parse(localStorage.getItem('pro_habits_v1')) || [
      { id: 1, name: 'Meditate', streak: 48, icon: '💧', unit: 'DAYS', theme: 'theme-blue', completed: false, week: [1,1,1,1,1,0,0] },
      { id: 2, name: 'Work out', streak: 116, icon: '🔥', unit: 'WEEKS', theme: 'theme-pink', completed: true, week: [1,0,1,1,0,0,0] },
      { id: 3, name: 'Read', streak: 21, icon: '💧', unit: 'WEEKS', theme: 'theme-green', completed: false, week: [1,1,1,1,0,0,0] },
      { id: 4, name: 'Guitar', streak: 236, icon: '🔥', unit: 'DAYS', theme: 'theme-orange', completed: false, week: [1,1,1,1,1,0,0] },
      { id: 5, name: 'Yoga', streak: 17, icon: '🔥', unit: 'DAYS', theme: 'theme-red', completed: true, week: [1,1,1,1,1,0,0] },
      { id: 6, name: 'Run', streak: 15, icon: '💧', unit: 'WEEKS', theme: 'theme-purple', completed: false, week: [0,1,0,1,0,0,0] },
      { id: 7, name: 'Get up early', streak: 42, icon: '💧', unit: 'DAYS', theme: 'theme-cyan', completed: false, week: [1,1,1,1,1,0,0] },
      { id: 8, name: 'Study', streak: 371, icon: '🔥', unit: 'DAYS', theme: 'theme-yellow', completed: false, week: [1,1,1,1,1,0,0] }
    ];

    var daysLetters = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

    function renderGrid() {
      var grid = document.getElementById('habitsGrid');
      grid.innerHTML = '';

      habits.forEach(function(h) {
        var completedDays = h.week.reduce((a, b) => a + b, 0);
        
        var dotsHtml = h.week.map(function(active, i) {
          return '<div class="dot ' + (active ? 'active' : '') + '">' + daysLetters[i] + '</div>';
        }).join('');

        var card = document.createElement('div');
        card.className = 'habit-card ' + h.theme;
        card.innerHTML = 
          '<div>' +
            '<div class="card-header">' +
              '<div>' +
                '<div class="streak-count">' + h.streak + ' ' + h.icon + '</div>' +
                '<div class="streak-unit">' + h.unit + '</div>' +
              '</div>' +
              '<button class="check-circle" onclick="toggleCheck(' + h.id + ')">' + (h.completed ? '✓' : '') + '</button>' +
            '</div>' +
          '</div>' +
          '<div>' +
            '<div class="habit-title">' + h.name + '</div>' +
            '<div class="week-dots">' +
              dotsHtml +
              '<span class="week-ratio">' + completedDays + '/7</span>' +
            '</div>' +
          '</div>';

        grid.appendChild(card);
      });

      localStorage.setItem('pro_habits_v1', JSON.stringify(habits));
    }

    function toggleCheck(id) {
      habits = habits.map(function(h) {
        if (h.id === id) {
          var isDone = !h.completed;
          return Object.assign({}, h, {
            completed: isDone,
            streak: isDone ? h.streak + 1 : Math.max(0, h.streak - 1)
          });
        }
        return h;
      });
      renderGrid();
    }

    function openModal() { document.getElementById('habitModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('habitModal').style.display = 'none'; }

    function saveHabit() {
      var name = document.getElementById('habitName').value;
      var icon = document.getElementById('habitIcon').value;
      var theme = document.getElementById('habitTheme').value;
      if (!name) return;

      habits.push({
        id: Date.now(),
        name: name,
        streak: 1,
        icon: icon,
        unit: icon === '🔥' ? 'WEEKS' : 'DAYS',
        theme: theme,
        completed: false,
        week: [1, 0, 0, 0, 0, 0, 0]
      });

      closeModal();
      renderGrid();
    }

    renderGrid();
  </script>
</body>
</html>
